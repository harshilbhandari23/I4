<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- three crossing orbits -->
  <ellipse cx="32" cy="32" rx="27" ry="10.5"/>
  <ellipse cx="32" cy="32" rx="27" ry="10.5" transform="rotate(60 32 32)"/>
  <ellipse cx="32" cy="32" rx="27" ry="10.5" transform="rotate(120 32 32)"/>
  <!-- nucleus (qubit) -->
  <circle cx="32" cy="32" r="4.2"/>
  <circle cx="32" cy="32" r="1.4"/>
  <!-- electrons -->
  <circle cx="59" cy="32" r="2.3"/>
  <circle cx="18.5" cy="8.6" r="2.3"/>
  <circle cx="45.5" cy="55.4" r="2.3"/>
  <circle cx="5" cy="32" r="1.5"/>
  <!-- probability sparkles -->
  <path d="M50 6.5l2-3M55 11l3.4-1.6M10 55.5l-2 3M5.4 49.8l-3 1.4"/>
  <!-- qubit state ticks -->
  <path d="M32 2.5v5M32 56.5v5"/>
  <circle cx="32" cy="1.6" r="0.9"/>
  <circle cx="32" cy="62.4" r="0.9"/>
</svg>
